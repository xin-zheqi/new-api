# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!
# All settings below are filled directly in this file; no .env file is required.
# Replace REPLACE_WITH_* with the EXISTING deployment values before use.
# Keep the original database credentials and application secrets when upgrading.

services:
  new-api:
    image: thefoolishfox1/new-api
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      # Keep the existing username/password; URL-encode special characters in URL passwords.
      - SQL_DSN=postgresql://root:REPLACE_WITH_URLENCODED_POSTGRES_PASSWORD@postgres:5432/new-api
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/new-api-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:REPLACE_WITH_URLENCODED_REDIS_PASSWORD@redis:6379
      - SESSION_SECRET=REPLACE_WITH_EXISTING_SESSION_SECRET
      # If the existing deployment sets CRYPTO_SECRET, preserve that exact value too.
#      - CRYPTO_SECRET=REPLACE_WITH_EXISTING_CRYPTO_SECRET
      # HTTPS: keep true and fill the existing trusted origins. For local HTTP,
      # use false and an empty SESSION_COOKIE_TRUSTED_URL, matching the existing setup.
      - SESSION_COOKIE_SECURE=true
      - SESSION_COOKIE_TRUSTED_URL=REPLACE_WITH_EXISTING_HTTPS_ORIGIN_LIST
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    # Fill the raw existing Redis password here, and its URL-encoded form above.
    command: ["redis-server", "--requirepass", "REPLACE_WITH_EXISTING_REDIS_PASSWORD"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      # If the existing username is not root, update SQL_DSN and BACKUP_DB_USER too.
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "REPLACE_WITH_EXISTING_POSTGRES_PASSWORD"
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

  # Explicitly enable with --profile backup. Fill settings directly below.
  # Startup reuses a valid repository or initializes a confirmed empty destination.
  backup:
    profiles: ["backup"]
    image: thefoolishfox1/new-api-backup:20261117-temp-storage-fix
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 30s
    tmpfs:
      # Restic temporary packs use the disk-backed /cache volume, not this tmpfs.
      - /tmp:size=64m,mode=1777
    environment:
      TZ: Asia/Shanghai
      # Match the existing database service and its actual credentials.
      BACKUP_DB_HOST: postgres
      BACKUP_DB_PORT: "5432"
      BACKUP_DB_USER: "root"
      BACKUP_DB_PASSWORD: "REPLACE_WITH_EXISTING_POSTGRES_PASSWORD"
      BACKUP_DB_SSLMODE: prefer
      BACKUP_DATABASES: new-api
      # Include a separate log database on this server if one is configured.
      # BACKUP_DATABASES: "new-api,new-api-log"

      # Endpoint must match the bucket region. Fill the complete repository path.
      BACKUP_REPOSITORY: "rclone:oss:REPLACE_WITH_OSS_BUCKET/newapi/production"
      BACKUP_PASSWORD_FILE: /run/secrets/restic-password
      # First initialization of an empty shared repository uses one bootstrap node.
      # Existing repositories are verified/reused on redeployment; false disables auto-init.
      BACKUP_AUTO_INIT: "true"
      BACKUP_OSS_ENDPOINT: "oss-cn-hangzhou.aliyuncs.com"
      BACKUP_OSS_ACCESS_KEY_ID: "REPLACE_WITH_OSS_ACCESS_KEY_ID"
      BACKUP_OSS_ACCESS_KEY_SECRET: "REPLACE_WITH_OSS_ACCESS_KEY_SECRET"
      # Keep these identifiers stable after the first successful backup.
      BACKUP_HOST: newapi
      BACKUP_TAG: new-api

      # daily: run at these local times. interval: wait after each job finishes.
      BACKUP_SCHEDULE_MODE: daily
      BACKUP_TIMES: "03:30"
      # Multiple times are supported, e.g. "03:30,15:30,23:00".
      BACKUP_INTERVAL: "6h"
      BACKUP_TIMEOUT_SECONDS: "7200"
      BACKUP_RETRIES: "2"
      BACKUP_RETRY_DELAY_SECONDS: "10"
      BACKUP_MIN_FREE_MB: "1024"
      BACKUP_MAX_DUMP_MB: "4096"
      BACKUP_MAX_CACHE_MB: "512"
      BACKUP_BW_LIMIT: "8M"
      # These policies apply only when retention is explicitly invoked.
      BACKUP_KEEP_DAILY: "7"
      BACKUP_KEEP_WEEKLY: "4"
      BACKUP_KEEP_MONTHLY: "6"
      BACKUP_HEALTH_MAX_AGE_HOURS: ""
    volumes:
      - type: bind
        source: ./data
        target: /source/data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./logs
        target: /source/logs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker-compose.yml
        target: /source/config/docker-compose.yml
        read_only: true
        bind: {create_host_path: false}
      # Also mount any extra configuration or secret files used by your deployment
      # read-only under /source/config so they are included in the backup.
      - type: bind
        source: ./secrets/backup/restic-password
        target: /run/secrets/restic-password
        read_only: true
        bind: {create_host_path: false}
      - backup_state:/state
      - backup_cache:/cache
    networks:
      - new-api-network

